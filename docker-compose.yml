version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: syncly_db
    environment:
      POSTGRES_DB: syncly
      POSTGRES_USER: syncly
      POSTGRES_PASSWORD: syncly_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncly']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncly_backend
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://syncly:syncly_dev@postgres:5432/syncly
      JWT_SECRET: change-this-in-production
      PORT: 3000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: syncly_dashboard
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./dashboard:/app
      - /app/node_modules

volumes:
  pgdata:
